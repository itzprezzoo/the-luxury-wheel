<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Wheel Spinner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap');
    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
    }
    
    /* Glowing Effects */
    .glow-pointer {
      filter: drop-shadow(0px 4px 10px rgba(239, 68, 68, 0.8));
    }
    .glow-wheel {
      box-shadow: 0 0 50px rgba(124, 58, 237, 0.3), inset 0 0 20px rgba(0, 0, 0, 0.5);
    }
    
    /* Segment Text Styling */
    .wheel-text {
      font-weight: 800;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
      font-size: 16px;
      text-shadow: 0px 2px 4px rgba(0,0,0,0.8);
      user-select: none;
      pointer-events: none;
    }
    
    .slice-path {
      transition: opacity 0.2s ease, filter 0.2s ease;
      cursor: pointer;
    }
    .slice-path:hover {
      filter: brightness(1.15);
    }

    /* Modal Animation */
    .modal-animate {
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col items-center justify-between p-4 sm:p-6">

  <!-- TOP HEADER -->
  <header class="w-full max-w-2xl flex justify-between items-center py-2 border-b border-slate-800">
    <div class="flex items-center space-x-2">
      <div class="bg-indigo-600 p-2 rounded-xl text-xl text-white shadow-lg shadow-indigo-500/30">
        <i class="fa-solid fa-dharmachakra"></i>
      </div>
      <h1 class="text-xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400">
        SpinWheel Studio
      </h1>
    </div>
    <button onclick="resetSetup()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-3 py-1.5 rounded-xl text-xs font-semibold border border-slate-700 transition flex items-center gap-1.5">
      <i class="fa-solid fa-plus"></i> New Wheel
    </button>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="w-full max-w-md my-auto flex flex-col items-center py-6 space-y-6">

    <!-- STEP 1: INITIAL SETUP CARD -->
    <div id="setupCard" class="w-full bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-5 text-center">
      <div class="space-y-1">
        <h2 class="text-2xl font-black text-white">Create Your Wheel</h2>
        <p class="text-xs text-slate-400">Select how many segments you want on your wheel</p>
      </div>

      <div class="space-y-3">
        <div class="flex justify-center items-center space-x-4">
          <button onclick="adjustSegmentCount(-1)" class="w-12 h-12 bg-slate-800 hover:bg-slate-700 rounded-2xl border border-slate-700 text-xl font-bold flex items-center justify-center transition active:scale-95">-</button>
          <span id="segmentCountDisplay" class="text-4xl font-black text-indigo-400 font-mono w-16 text-center">6</span>
          <button onclick="adjustSegmentCount(1)" class="w-12 h-12 bg-slate-800 hover:bg-slate-700 rounded-2xl border border-slate-700 text-xl font-bold flex items-center justify-center transition active:scale-95">+</button>
        </div>
        <p class="text-[11px] text-slate-500">Choose between 2 and 20 segments</p>
      </div>

      <button onclick="createWheel()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-extrabold py-3.5 rounded-2xl shadow-xl shadow-indigo-600/30 text-sm uppercase tracking-wider transition active:scale-95">
        Create Wheel
      </button>
    </div>

    <!-- STEP 2: WHEEL DISPLAY & INTERACTION -->
    <div id="wheelContainer" class="w-full hidden flex flex-col items-center space-y-6">
      
      <!-- WHEEL GRAPHIC AREA -->
      <div class="relative w-80 h-80 sm:w-96 sm:h-96 flex items-center justify-center">
        <!-- Pointer Arrow -->
        <div class="absolute -top-3 z-30 glow-pointer">
          <div class="w-0 h-0 border-l-[16px] border-l-transparent border-r-[16px] border-r-transparent border-t-[28px] border-t-red-500"></div>
        </div>

        <!-- SVG Wheel -->
        <div class="w-full h-full rounded-full border-4 border-slate-800 glow-wheel relative overflow-hidden bg-slate-900">
          <svg id="wheelSvg" viewBox="0 0 500 500" class="w-full h-full transform origin-center">
            <!-- Slices populated via JS -->
          </svg>
        </div>

        <!-- Center Hub -->
        <div class="absolute w-16 h-16 bg-slate-900 border-4 border-slate-700 rounded-full shadow-2xl flex items-center justify-center z-20 pointer-events-none">
          <i class="fa-solid fa-star text-amber-400 text-lg"></i>
        </div>
      </div>

      <!-- STATUS & SPIN BUTTON -->
      <div class="w-full flex flex-col items-center space-y-3">
        <div id="fillStatus" class="text-xs font-semibold text-amber-400 bg-amber-400/10 px-3 py-1.5 rounded-full border border-amber-400/20 flex items-center gap-1.5">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span>Click segments below or on the wheel to fill all names!</span>
        </div>

        <!-- Spin Button (Hidden until fully filled) -->
        <button id="spinBtn" onclick="spinWheel()" class="hidden w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-black py-4 rounded-2xl shadow-2xl shadow-emerald-500/30 text-base uppercase tracking-widest transition transform active:scale-95 flex items-center justify-center gap-2">
          <i class="fa-solid fa-play"></i> SPIN THE WHEEL!
        </button>
      </div>

      <!-- SEGMENTS EDITING LIST -->
      <div class="w-full bg-slate-900/60 border border-slate-800 rounded-3xl p-4 space-y-3">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-1">Segment Labels</h3>
        <div id="segmentInputsList" class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-48 overflow-y-auto pr-1">
          <!-- Input fields populated via JS -->
        </div>
      </div>

    </div>
  </main>

  <!-- EDIT SEGMENT MODAL -->
  <div id="editModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 max-w-sm w-full rounded-3xl p-6 space-y-4 shadow-2xl modal-animate">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-extrabold text-white text-base">Edit Segment <span id="modalSegmentNum" class="text-indigo-400">#1</span></h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-400 mb-1">Enter Name / Word</label>
        <input type="text" id="modalInput" placeholder="e.g. Winner, Option A, Prize..." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
      </div>

      <div class="flex gap-2">
        <button onclick="closeEditModal()" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-xs transition">Cancel</button>
        <button onclick="saveModalInput()" class="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-indigo-600/30">Save Label</button>
      </div>
    </div>
  </div>

  <!-- WINNER CELEBRATION MODAL -->
  <div id="winnerModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-amber-500/40 max-w-sm w-full rounded-3xl p-6 space-y-5 text-center shadow-2xl modal-animate">
      <div class="inline-flex bg-amber-500/10 border border-amber-500/30 p-4 rounded-full text-4xl text-amber-400">
        <i class="fa-solid fa-trophy animate-bounce"></i>
      </div>

      <div class="space-y-1">
        <span class="text-xs font-extrabold uppercase tracking-widest text-amber-400">We Have A Winner!</span>
        <h2 id="winnerNameDisplay" class="text-3xl font-black text-white break-words">---</h2>
      </div>

      <button onclick="closeWinnerModal()" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-black py-3.5 rounded-2xl shadow-xl shadow-amber-500/20 text-xs uppercase tracking-wider transition active:scale-95">
        Awesome!
      </button>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="text-center text-[11px] text-slate-500 py-2">
    SpinWheel Studio &bull; Custom Interactive Wheel
  </footer>

  <script>
    // Color Palette Generator
    const sliceColors = [
      '#6366f1', '#ec4899', '#8b5cf6', '#10b981', 
      '#f59e0b', '#06b6d4', '#f43f5e', '#3b82f6',
      '#a855f7', '#84cc16', '#eab308', '#14b8a6'
    ];

    let segmentCount = 6;
    let segmentValues = [];
    let activeEditIndex = null;
    let isSpinning = false;
    let currentRotation = 0;

    function adjustSegmentCount(delta) {
      segmentCount = Math.max(2, Math.min(20, segmentCount + delta));
      document.getElementById('segmentCountDisplay').innerText = segmentCount;
    }

    function resetSetup() {
      if (isSpinning) return;
      document.getElementById('setupCard').classList.remove('hidden');
      document.getElementById('wheelContainer').classList.add('hidden');
      document.getElementById('spinBtn').classList.add('hidden');
    }

    function createWheel() {
      segmentValues = new Array(segmentCount).fill('');
      document.getElementById('setupCard').classList.add('hidden');
      document.getElementById('wheelContainer').classList.remove('hidden');
      renderWheel();
      renderInputsList();
      checkCompletion();
    }

    function renderWheel() {
      const svg = document.getElementById('wheelSvg');
      svg.innerHTML = '';
      
      const numSlices = segmentCount;
      const anglePerSlice = 360 / numSlices;
      const radius = 250;
      const center = 250;

      for (let i = 0; i < numSlices; i++) {
        const startAngle = i * anglePerSlice - 90; // Start at top
        const endAngle = startAngle + anglePerSlice;

        const x1 = center + radius * Math.cos(Math.PI * startAngle / 180);
        const y1 = center + radius * Math.sin(Math.PI * startAngle / 180);
        const x2 = center + radius * Math.cos(Math.PI * endAngle / 180);
        const y2 = center + radius * Math.sin(Math.PI * endAngle / 180);

        const largeArc = anglePerSlice > 180 ? 1 : 0;
        const pathData = `M ${center} ${center} L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} Z`;

        const color = sliceColors[i % sliceColors.length];

        // Slice Path
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', pathData);
        path.setAttribute('fill', color);
        path.setAttribute('class', 'slice-path');
        path.setAttribute('stroke', '#0f172a');
        path.setAttribute('stroke-width', '3');
        path.onclick = () => openEditModal(i);
        svg.appendChild(path);

        // Text Arc Placement
        const textAngle = startAngle + anglePerSlice / 2;
        const textRadius = radius * 0.65;
        const textX = center + textRadius * Math.cos(Math.PI * textAngle / 180);
        const textY = center + textRadius * Math.sin(Math.PI * textAngle / 180);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', textX);
        text.setAttribute('y', textY);
        text.setAttribute('class', 'wheel-text');
        text.setAttribute('transform', `rotate(${textAngle + 90}, ${textX}, ${textY})`);
        
        // Truncate long text for rendering inside wheel
        const labelText = segmentValues[i] || `Slice ${i + 1}`;
        text.textContent = labelText.length > 10 ? labelText.substring(0, 9) + '…' : labelText;
        if (!segmentValues[i]) text.setAttribute('opacity', '0.4');

        svg.appendChild(text);
      }
    }

    function renderInputsList() {
      const list = document.getElementById('segmentInputsList');
      list.innerHTML = '';

      for (let i = 0; i < segmentCount; i++) {
        const color = sliceColors[i % sliceColors.length];
        const val = segmentValues[i] || '';

        const item = document.createElement('div');
        item.className = 'flex items-center gap-2 bg-slate-800/80 p-2 rounded-xl border border-slate-700/60';
        item.innerHTML = `
          <div class="w-3.5 h-3.5 rounded-full flex-shrink-0" style="background-color: ${color}"></div>
          <input type="text" value="${val}" placeholder="Segment ${i + 1}" oninput="updateSegmentValue(${i}, this.value)" 
            class="w-full bg-transparent text-xs text-white placeholder-slate-500 focus:outline-none font-semibold">
        `;
        list.appendChild(item);
      }
    }

    function updateSegmentValue(index, val) {
      segmentValues[index] = val;
      renderWheel();
      checkCompletion();
    }

    function openEditModal(index) {
      if (isSpinning) return;
      activeEditIndex = index;
      document.getElementById('modalSegmentNum').innerText = `#${index + 1}`;
      document.getElementById('modalInput').value = segmentValues[index] || '';
      document.getElementById('editModal').classList.remove('hidden');
      setTimeout(() => document.getElementById('modalInput').focus(), 100);
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
      activeEditIndex = null;
    }

    function saveModalInput() {
      if (activeEditIndex !== null) {
        const val = document.getElementById('modalInput').value.trim();
        updateSegmentValue(activeEditIndex, val);
        renderInputsList();
      }
      closeEditModal();
    }

    function checkCompletion() {
      const allFilled = segmentValues.length > 0 && segmentValues.every(v => v && v.trim() !== '');
      const fillStatus = document.getElementById('fillStatus');
      const spinBtn = document.getElementById('spinBtn');

      if (allFilled) {
        fillStatus.classList.add('hidden');
        spinBtn.classList.remove('hidden');
      } else {
        fillStatus.classList.remove('hidden');
        spinBtn.classList.add('hidden');
      }
    }

    function spinWheel() {
      if (isSpinning) return;
      isSpinning = true;

      const spinBtn = document.getElementById('spinBtn');
      spinBtn.disabled = true;
      spinBtn.classList.add('opacity-50', 'cursor-not-allowed');

      // Calculate Random Winner Slice
      const numSlices = segmentCount;
      const winnerIndex = Math.floor(Math.random() * numSlices);
      const anglePerSlice = 360 / numSlices;

      // Calculate rotational offset so chosen segment lands under top pointer (0deg / 360deg)
      const sliceCenterAngle = (winnerIndex * anglePerSlice) + (anglePerSlice / 2);
      const targetAngle = 360 - sliceCenterAngle;
      
      // Add multiple full rotations (5-8 full spins)
      const extraSpins = (5 + Math.floor(Math.random() * 3)) * 360;
      const totalRotationNeeded = currentRotation + extraSpins + (targetAngle - (currentRotation % 360) + 360) % 360;

      currentRotation = totalRotationNeeded;

      const svg = document.getElementById('wheelSvg');
      svg.style.transition = 'transform 5s cubic-bezier(0.15, 0.9, 0.2, 1)';
      svg.style.transform = `rotate(${currentRotation}deg)`;

      // Handle Completion
      setTimeout(() => {
        isSpinning = false;
        spinBtn.disabled = false;
        spinBtn.classList.remove('opacity-50', 'cursor-not-allowed');

        const winnerName = segmentValues[winnerIndex];
        triggerCelebration(winnerName);
      }, 5000);
    }

    function triggerCelebration(winnerName) {
      // Confetti burst
      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 }
      });

      document.getElementById('winnerNameDisplay').innerText = winnerName;
      document.getElementById('winnerModal').classList.remove('hidden');
    }

    function closeWinnerModal() {
      document.getElementById('winnerModal').classList.add('hidden');
    }
  </script>
</body>
</html>
