<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glass Prism Wheel Spinner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap');
    
    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
    }

    /* Glass Bezel Effect */
    .glass-bezel {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 255, 255, 0.18);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.8),
        inset 0 0 25px rgba(255, 255, 255, 0.15),
        0 0 30px rgba(56, 189, 248, 0.2);
    }

    /* Glass Center Crystal Hub */
    .glass-hub {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.6),
        inset 0 0 12px rgba(255, 255, 255, 0.3);
    }

    .pointer-glow {
      filter: drop-shadow(0px 0px 12px rgba(244, 63, 94, 0.9));
    }

    /* Slices Translucency & Gloss */
    .slice-path {
      transition: filter 0.2s ease;
      cursor: pointer;
      opacity: 0.85;
    }
    .slice-path:hover {
      opacity: 1;
      filter: brightness(1.3);
    }

    .wheel-text {
      font-weight: 800;
      fill: #ffffff;
      dominant-baseline: central;
      text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.9);
      user-select: none;
      pointer-events: none;
    }

    /* Smooth Dynamic Zoom Stage */
    .wheel-stage {
      transition: transform 1.5s cubic-bezier(0.25, 1, 0.5, 1);
      transform-origin: center 10%;
    }
    .wheel-stage.zoomed {
      transform: scale(1.4) translateY(30px);
    }

    /* Wheel Transition */
    #wheelSvg {
      transform-origin: center center;
      will-change: transform;
    }

    .modal-pop {
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col items-center justify-between p-4 sm:p-6 overflow-x-hidden">

  <!-- HEADER -->
  <header class="w-full max-w-2xl flex justify-between items-center py-2 border-b border-slate-800/80 z-10">
    <div class="flex items-center space-x-2.5">
      <div class="bg-cyan-500/10 border border-cyan-400/30 p-2 rounded-xl text-cyan-400 text-xl font-black shadow-lg">
        <i class="fa-solid fa-gem"></i>
      </div>
      <div>
        <h1 class="text-xl font-black tracking-tight text-white uppercase">
          GLASS SPINNER
        </h1>
        <p class="text-[10px] text-cyan-400 font-semibold tracking-widest uppercase">Prism Edition</p>
      </div>
    </div>
    <button onclick="resetSetup()" class="bg-slate-900/80 hover:bg-slate-800 text-slate-300 hover:text-white px-3.5 py-2 rounded-xl text-xs font-bold border border-slate-700/60 transition flex items-center gap-1.5 shadow-md">
      <i class="fa-solid fa-plus text-cyan-400"></i> New Wheel
    </button>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="w-full max-w-lg my-auto flex flex-col items-center py-4 space-y-6">

    <!-- STEP 1: INITIAL SETUP CARD -->
    <div id="setupCard" class="w-full bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6 text-center">
      <div class="space-y-1">
        <h2 class="text-2xl font-black text-white uppercase tracking-wide">Glass Wheel Setup</h2>
        <p class="text-xs text-slate-400">Select total segments (Up to 100)</p>
      </div>

      <!-- Segment Counter Input -->
      <div class="space-y-3 bg-slate-950/60 p-4 rounded-2xl border border-slate-800/80">
        <div class="flex justify-center items-center space-x-3">
          <button onclick="adjustSegmentCount(-5)" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 rounded-xl border border-slate-700 text-sm font-extrabold flex items-center justify-center transition active:scale-95">-5</button>
          <button onclick="adjustSegmentCount(-1)" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 rounded-xl border border-slate-700 text-base font-extrabold flex items-center justify-center transition active:scale-95">-1</button>
          
          <input type="number" id="segmentInput" value="12" min="2" max="100" onchange="setDirectSegmentCount(this.value)"
            class="text-3xl font-black text-cyan-400 font-mono w-20 text-center bg-transparent border-b-2 border-cyan-500/50 focus:outline-none focus:border-cyan-400">
          
          <button onclick="adjustSegmentCount(1)" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 rounded-xl border border-slate-700 text-base font-extrabold flex items-center justify-center transition active:scale-95">+1</button>
          <button onclick="adjustSegmentCount(5)" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 rounded-xl border border-slate-700 text-sm font-extrabold flex items-center justify-center transition active:scale-95">+5</button>
        </div>
        <p class="text-[11px] text-slate-500 font-semibold">Supports 2 to 100 segments</p>
      </div>

      <button onclick="createWheel()" class="w-full bg-gradient-to-r from-cyan-500 via-sky-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black py-4 rounded-2xl shadow-xl shadow-cyan-500/20 text-xs uppercase tracking-widest transition active:scale-95">
        Build Glass Wheel
      </button>
    </div>

    <!-- STEP 2: WHEEL DISPLAY & EDITING -->
    <div id="wheelContainer" class="w-full hidden flex flex-col items-center space-y-6">
      
      <!-- ZOOMABLE STAGE -->
      <div id="wheelStage" class="wheel-stage relative w-80 h-80 sm:w-96 sm:h-96 flex items-center justify-center">
        
        <!-- Top Glass Marker Pointer -->
        <div class="absolute -top-5 z-30 pointer-glow">
          <div class="w-0 h-0 border-l-[20px] border-l-transparent border-r-[20px] border-r-transparent border-t-[34px] border-t-rose-500"></div>
          <div class="w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-t-[22px] border-t-white -mt-[32px] mx-auto"></div>
        </div>

        <!-- Glass Bezel Outer Ring -->
        <div class="w-full h-full rounded-full p-4 glass-bezel relative flex items-center justify-center">
          
          <!-- Gloss Highlights -->
          <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-transparent via-white/10 to-transparent pointer-events-none"></div>

          <!-- SVG Wheel Canvas -->
          <div class="w-full h-full rounded-full bg-slate-950/90 shadow-2xl relative overflow-hidden flex items-center justify-center border border-white/10">
            <svg id="wheelSvg" viewBox="0 0 1000 1000" class="w-full h-full">
              <!-- Slices rendered by JS -->
            </svg>
          </div>
        </div>

        <!-- Frosted Crystal Center Cap -->
        <div class="absolute w-16 h-16 sm:w-20 sm:h-20 rounded-full glass-hub flex items-center justify-center z-20 pointer-events-none">
          <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-slate-950/80 border border-white/30 flex items-center justify-center shadow-inner">
            <i class="fa-solid fa-gem text-cyan-300 text-xs sm:text-sm"></i>
          </div>
        </div>
      </div>

      <!-- STATUS & SPIN ACTION -->
      <div class="w-full flex flex-col items-center space-y-3 z-10">
        <div id="fillStatus" class="text-xs font-semibold text-cyan-300 bg-cyan-500/10 px-4 py-2 rounded-xl border border-cyan-400/20 flex items-center gap-2">
          <i class="fa-solid fa-triangle-exclamation text-cyan-400"></i>
          <span>Fill all segment names to unlock SPIN!</span>
        </div>

        <!-- Spin Button -->
        <button id="spinBtn" onclick="spinWheel()" class="hidden w-full bg-gradient-to-r from-emerald-400 via-teal-400 to-cyan-500 hover:from-emerald-300 hover:to-cyan-400 text-slate-950 font-black py-4 rounded-2xl shadow-2xl shadow-cyan-500/30 text-base uppercase tracking-widest transition transform active:scale-95 flex items-center justify-center gap-2 border border-white/40">
          <i class="fa-solid fa-play"></i> SPIN WHEEL
        </button>
      </div>

      <!-- SEGMENTS MANAGEMENT LIST -->
      <div class="w-full bg-slate-900/80 border border-slate-800/80 rounded-3xl p-4 space-y-3 shadow-xl z-10 backdrop-blur-md">
        <div class="flex justify-between items-center px-1">
          <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Segments Editor</h3>
          <button onclick="openBulkModal()" class="text-[11px] font-bold text-cyan-400 hover:underline flex items-center gap-1">
            <i class="fa-solid fa-file-import"></i> Bulk Paste Names
          </button>
        </div>

        <div id="segmentInputsList" class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-52 overflow-y-auto pr-1">
          <!-- Populated by JS -->
        </div>
      </div>

    </div>
  </main>

  <!-- BULK PASTE MODAL -->
  <div id="bulkModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 max-w-md w-full rounded-3xl p-6 space-y-4 shadow-2xl modal-pop">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-black text-white text-base">Bulk Paste Segment Names</h3>
        <button onclick="closeBulkModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div>
        <p class="text-xs text-slate-400 mb-2">Paste names separated by commas or new lines.</p>
        <textarea id="bulkTextarea" rows="6" placeholder="Item 1&#10;Item 2&#10;Item 3..." class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 text-xs text-white focus:outline-none focus:border-cyan-500 font-mono"></textarea>
      </div>

      <div class="flex gap-2">
        <button onclick="closeBulkModal()" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-xs">Cancel</button>
        <button onclick="applyBulkNames()" class="w-1/2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black py-2.5 rounded-xl text-xs uppercase tracking-wider">Apply Names</button>
      </div>
    </div>
  </div>

  <!-- EDIT SINGLE SEGMENT MODAL -->
  <div id="editModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 max-w-sm w-full rounded-3xl p-6 space-y-4 shadow-2xl modal-pop">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-extrabold text-white text-base">Edit Segment <span id="modalSegmentNum" class="text-cyan-400">#1</span></h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-400 mb-1">Segment Label</label>
        <input type="text" id="modalInput" placeholder="Enter name..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-cyan-500">
      </div>

      <div class="flex gap-2">
        <button onclick="closeEditModal()" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-xs">Cancel</button>
        <button onclick="saveModalInput()" class="w-1/2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black py-2.5 rounded-xl text-xs uppercase">Save Label</button>
      </div>
    </div>
  </div>

  <!-- WINNER MODAL -->
  <div id="winnerModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-cyan-500/50 max-w-sm w-full rounded-3xl p-6 space-y-5 text-center shadow-2xl modal-pop">
      <div class="inline-flex bg-cyan-500/10 border border-cyan-500/30 p-4 rounded-full text-4xl text-cyan-400">
        <i class="fa-solid fa-trophy animate-bounce"></i>
      </div>

      <div class="space-y-1">
        <span class="text-[11px] font-black uppercase tracking-widest text-cyan-400">WINNING SEGMENT</span>
        <h2 id="winnerNameDisplay" class="text-3xl font-black text-white break-words">---</h2>
      </div>

      <button onclick="closeWinnerModal()" class="w-full bg-gradient-to-r from-cyan-400 to-blue-500 hover:from-cyan-300 hover:to-blue-400 text-slate-950 font-black py-3.5 rounded-2xl text-xs uppercase tracking-wider">
        Awesome!
      </button>
    </div>
  </div>

  <script>
    // Frosted Prism Palette
    const sliceColors = [
      '#06b6d4', '#ec4899', '#3b82f6', '#10b981', '#f59e0b', 
      '#8b5cf6', '#f43f5e', '#14b8a6', '#6366f1', '#a855f7',
      '#0284c7', '#d97706', '#059669', '#c026d3', '#4f46e5'
    ];

    let segmentCount = 12;
    let segmentValues = [];
    let activeEditIndex = null;
    let isSpinning = false;
    let currentRotation = 0;

    function adjustSegmentCount(delta) {
      setDirectSegmentCount(segmentCount + delta);
    }

    function setDirectSegmentCount(val) {
      segmentCount = Math.max(2, Math.min(100, parseInt(val) || 2));
      document.getElementById('segmentInput').value = segmentCount;
    }

    function resetSetup() {
      if (isSpinning) return;
      document.getElementById('setupCard').classList.remove('hidden');
      document.getElementById('wheelContainer').classList.add('hidden');
      document.getElementById('spinBtn').classList.add('hidden');
      document.getElementById('wheelStage').classList.remove('zoomed');
    }

    function createWheel() {
      segmentValues = new Array(segmentCount).fill('');
      document.getElementById('setupCard').classList.add('hidden');
      document.getElementById('wheelContainer').classList.remove('hidden');
      renderWheel();
      renderInputsList();
      checkCompletion();
    }

    function renderWheel() {
      const svg = document.getElementById('wheelSvg');
      svg.innerHTML = '';

      const numSlices = segmentCount;
      const anglePerSlice = 360 / numSlices;
      const radius = 500;
      const center = 500;

      let fontSize = 28;
      if (numSlices > 20) fontSize = 20;
      if (numSlices > 40) fontSize = 14;
      if (numSlices > 70) fontSize = 10;

      for (let i = 0; i < numSlices; i++) {
        const startAngle = i * anglePerSlice - 90;
        const endAngle = startAngle + anglePerSlice;

        const x1 = center + radius * Math.cos(Math.PI * startAngle / 180);
        const y1 = center + radius * Math.sin(Math.PI * startAngle / 180);
        const x2 = center + radius * Math.cos(Math.PI * endAngle / 180);
        const y2 = center + radius * Math.sin(Math.PI * endAngle / 180);

        const largeArc = anglePerSlice > 180 ? 1 : 0;
        const pathData = `M ${center} ${center} L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} Z`;
        const color = sliceColors[i % sliceColors.length];

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', pathData);
        path.setAttribute('fill', color);
        path.setAttribute('class', 'slice-path');
        path.setAttribute('stroke', 'rgba(255, 255, 255, 0.25)');
        path.setAttribute('stroke-width', numSlices > 50 ? '1' : '2');
        path.onclick = () => openEditModal(i);
        svg.appendChild(path);

        // Radial Text
        const midAngle = startAngle + anglePerSlice / 2;
        const labelText = segmentValues[i] || `${i + 1}`;

        const textRadius = radius * 0.92; 
        const textX = center + textRadius * Math.cos(Math.PI * midAngle / 180);
        const textY = center + textRadius * Math.sin(Math.PI * midAngle / 180);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', textX);
        text.setAttribute('y', textY);
        text.setAttribute('class', 'wheel-text');
        text.setAttribute('font-size', `${fontSize}px`);
        text.setAttribute('text-anchor', 'start');

        text.setAttribute('transform', `rotate(${midAngle + 180}, ${textX}, ${textY})`);

        let maxChars = 18;
        if (numSlices > 30) maxChars = 12;
        if (numSlices > 60) maxChars = 8;

        text.textContent = labelText.length > maxChars ? labelText.substring(0, maxChars - 1) + '…' : labelText;
        if (!segmentValues[i]) text.setAttribute('opacity', '0.35');

        svg.appendChild(text);
      }
    }

    function renderInputsList() {
      const list = document.getElementById('segmentInputsList');
      list.innerHTML = '';

      for (let i = 0; i < segmentCount; i++) {
        const color = sliceColors[i % sliceColors.length];
        const val = segmentValues[i] || '';

        const item = document.createElement('div');
        item.className = 'flex items-center gap-2 bg-slate-950 p-2 rounded-xl border border-slate-800';
        item.innerHTML = `
          <div class="w-3 h-3 rounded-full flex-shrink-0" style="background-color: ${color}"></div>
          <span class="text-[10px] text-slate-500 font-mono w-5">#${i + 1}</span>
          <input type="text" value="${val}" placeholder="Segment ${i + 1}" oninput="updateSegmentValue(${i}, this.value)" 
            class="w-full bg-transparent text-xs text-white placeholder-slate-600 focus:outline-none font-semibold">
        `;
        list.appendChild(item);
      }
    }

    function updateSegmentValue(index, val) {
      segmentValues[index] = val;
      renderWheel();
      checkCompletion();
    }

    function openBulkModal() {
      if (isSpinning) return;
      document.getElementById('bulkTextarea').value = segmentValues.filter(v => v).join('\n');
      document.getElementById('bulkModal').classList.remove('hidden');
    }

    function closeBulkModal() {
      document.getElementById('bulkModal').classList.add('hidden');
    }

    function applyBulkNames() {
      const raw = document.getElementById('bulkTextarea').value;
      const names = raw.split(/[\n,]+/).map(n => n.trim()).filter(n => n.length > 0);

      for (let i = 0; i < segmentCount; i++) {
        segmentValues[i] = names[i] || '';
      }

      renderWheel();
      renderInputsList();
      checkCompletion();
      closeBulkModal();
    }

    function openEditModal(index) {
      if (isSpinning) return;
      activeEditIndex = index;
      document.getElementById('modalSegmentNum').innerText = `#${index + 1}`;
      document.getElementById('modalInput').value = segmentValues[index] || '';
      document.getElementById('editModal').classList.remove('hidden');
      setTimeout(() => document.getElementById('modalInput').focus(), 100);
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
      activeEditIndex = null;
    }

    function saveModalInput() {
      if (activeEditIndex !== null) {
        const val = document.getElementById('modalInput').value.trim();
        updateSegmentValue(activeEditIndex, val);
        renderInputsList();
      }
      closeEditModal();
    }

    function checkCompletion() {
      const allFilled = segmentValues.length > 0 && segmentValues.every(v => v && v.trim() !== '');
      const fillStatus = document.getElementById('fillStatus');
      const spinBtn = document.getElementById('spinBtn');

      if (allFilled) {
        fillStatus.classList.add('hidden');
        spinBtn.classList.remove('hidden');
      } else {
        fillStatus.classList.remove('hidden');
        spinBtn.classList.add('hidden');
      }
    }

    function spinWheel() {
      if (isSpinning) return;
      isSpinning = true;

      const spinBtn = document.getElementById('spinBtn');
      const stage = document.getElementById('wheelStage');
      const svg = document.getElementById('wheelSvg');
      
      spinBtn.disabled = true;
      spinBtn.classList.add('opacity-50', 'cursor-not-allowed');

      // Zoom in
      stage.classList.add('zoomed');

      const numSlices = segmentCount;
      const winnerIndex = Math.floor(Math.random() * numSlices);
      const anglePerSlice = 360 / numSlices;

      // Position winner directly under pointer (0 deg top)
      const sliceCenterAngle = (winnerIndex * anglePerSlice) + (anglePerSlice / 2);
      const targetAngle = 360 - sliceCenterAngle;
      
      // GUARANTEED MINIMUM 8 FULL ROTATIONS (2880 deg) + Extra spins + exact landing angle
      const fullRotations = 8 * 360; 
      const bonusSpins = Math.floor(Math.random() * 3) * 360; 
      const targetRotation = currentRotation + fullRotations + bonusSpins + ((targetAngle - (currentRotation % 360) + 360) % 360);

      currentRotation = targetRotation;

      // Reset transition to ensure browser registers animation
      svg.style.transition = 'none';
      svg.style.transform = `rotate(${currentRotation - (fullRotations + bonusSpins)}deg)`;
      
      // Force Reflow
      void svg.offsetHeight;

      // Apply 8-Second Easing Animation (Fast -> Dramatic Slow Crawl)
      svg.style.transition = 'transform 8s cubic-bezier(0.1, 0.9, 0.05, 1)';
      svg.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        isSpinning = false;
        spinBtn.disabled = false;
        spinBtn.classList.remove('opacity-50', 'cursor-not-allowed');

        const winnerName = segmentValues[winnerIndex];
        triggerCelebration(winnerName);
      }, 8200);
    }

    function triggerCelebration(winnerName) {
      confetti({
        particleCount: 180,
        spread: 100,
        origin: { y: 0.55 }
      });

      document.getElementById('winnerNameDisplay').innerText = winnerName;
      document.getElementById('winnerModal').classList.remove('hidden');
    }

    function closeWinnerModal() {
      document.getElementById('winnerModal').classList.add('hidden');
      document.getElementById('wheelStage').classList.remove('zoomed');
    }
  </script>
</body>
</html>
